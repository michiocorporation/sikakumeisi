<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>フラットデザイン｜再現・比較プレビュー</title><style>
*{box-sizing:border-box}body{margin:0;font:13px 'Yu Gothic',Meiryo,sans-serif;background:#edf0f4;color:#182a42}button,input{font:inherit}button{cursor:pointer}header{padding:20px 26px;display:flex;align-items:center;gap:25px;background:#fff;border-bottom:1px solid #dbe1e9}h1{margin:0;font-size:17px}header p{margin:5px 0 0;color:#7d8997;font-size:10px}.controls{display:flex;gap:5px;margin-left:auto;align-items:center;flex-wrap:wrap}.controls button{border:1px solid #d3dde8;padding:8px 15px;border-radius:5px;background:white;color:#3f526c;font-size:11px}.controls button[aria-pressed=true]{background:#0c5fd2;color:#fff;border-color:#0c5fd2}.controls a{margin-left:14px;font-size:11px;color:#2467c1;text-underline-offset:3px}.review-note{padding:12px 26px;color:#66798e;font-size:11px;display:flex;align-items:center;justify-content:space-between;gap:20px}.opacity-control{display:flex;align-items:center;gap:10px;white-space:nowrap}.opacity-control input{width:110px;accent-color:#075dd2}.comparison{width:100%;max-width:1672px;margin:0 auto 30px;position:relative;aspect-ratio:1672 / 941;background:#fff;box-shadow:0 5px 25px #24365014;overflow:hidden}.comparison iframe,.reference{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}.reference{pointer-events:none;object-fit:contain;opacity:0}.comparison.original .reference{opacity:1}.comparison.overlay .reference{opacity:var(--overlay,.5)}footer{padding:0 26px 25px;color:#7b8b9b;font-size:10px;line-height:1.8}footer a{color:#3167ad}[hidden]{display:none!important}:focus-visible{outline:3px solid #eab750;outline-offset:3px}@media(max-width:800px){header{align-items:flex-start;flex-direction:column;padding:18px;gap:15px}.controls{margin:0;gap:5px}.controls button{font-size:10px;padding:8px 10px}.controls a{margin-left:5px}.review-note{padding:12px 18px;font-size:10px;align-items:flex-start;flex-direction:column;gap:8px}.comparison{width:100%;overflow:hidden}footer{padding:0 18px 20px;font-size:9px}}
</style></head><body><header><div><h1>01 フラットデザイン</h1><p>元画像の構成を、文字を差し替えられるHTMLで再現</p></div><div class="controls" role="group" aria-label="比較表示"><button data-view="html" aria-pressed="true">制作したHTML</button><button data-view="original" aria-pressed="false">元画像</button><button data-view="overlay" aria-pressed="false">重ねて比較</button><a href="index.html">自分の情報を反映する ↗</a></div></header><div class="review-note"><span id="view-caption">元画像の見本文字で表示しています。文章・カード・ボタンは実際のHTMLです。</span><label class="opacity-control" id="opacity-control" hidden>元画像の濃さ <input id="opacity" type="range" min="0" max="100" value="50" aria-label="元画像の不透明度"><span id="opacity-value">50%</span></label></div><div class="comparison" id="comparison"><iframe src="previews/01-flat.html?reference=1&amp;thumbnail=1" title="フラットデザインのHTML再現"></iframe><img src="assets/flat-reference.png" class="reference" alt="添付された元のフラットデザイン画像"></div><footer>見本は好みを把握するための参考資料です。完成デザインの指定ではありません。<br>人物は元画像の写真を輪郭で切り抜いて使用しています。細い輪郭・手書き文字・アイコンの細部には差があります。</footer><script>
const comparison=document.querySelector('#comparison');const frame=comparison.querySelector('iframe');frame.style.width='1672px';frame.style.height='941px';frame.style.transformOrigin='top left';new ResizeObserver(entries=>{frame.style.transform=`scale(${entries[0].contentRect.width/1672})`;}).observe(comparison);document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{comparison.className='comparison '+button.dataset.view;document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));document.querySelector('#opacity-control').hidden=button.dataset.view!=='overlay';document.querySelector('#view-caption').textContent=({html:'元画像の見本文字で表示しています。文章・カード・ボタンは実際のHTMLです。',original:'添付された元画像を、そのまま表示しています。',overlay:'制作したHTMLに元画像を重ねています。スライダーで位置や大きさの差を確認できます。'})[button.dataset.view];}));document.querySelector('#opacity').addEventListener('input',e=>{comparison.style.setProperty('--overlay',e.target.value/100);document.querySelector('#opacity-value').textContent=e.target.value+'%';});
</script></body></html>
