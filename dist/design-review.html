</style><script src="catalog.js" defer></script><script src="design-review.js" defer></script></head><body><header><h1>参考画像との比較</h1><select id="design" aria-label="比較するデザイン"></select><button id="html" aria-pressed="true">HTML</button><button id="source" aria-pressed="false">参考画像</button><button id="overlay" aria-pressed="false">重ねて確認</button><label id="opacity-label" hidden>画像の濃さ <input id="opacity" type="range" min="0" max="100" value="50"></label><button id="overview" aria-pressed="false">20種類の一覧</button><a href="index.html">ヒアリング画面へ</a></header><main><p class="caption">制作確認用の比較画面です。画像内の文章と配色で構図を比較できます。お客様の入力と選択した配色は、ヒアリング画面の20種類に反映されます。</p><div id="single" class="stage"><iframe id="preview" title="HTMLのデザイン見本"></iframe><img id="reference" class="source" alt="添付された参考画像" hidden></div><div id="grid" class="grid" hidden></div></main></body></html>
