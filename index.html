<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="あなたの情報を20種類のデザイン見本に反映。シカクメイシのWebヒアリング。">
  <title>シカクメイシ Webヒアリング</title>
  <script>
    const destination = new URL('./dist/', window.location.href);
    destination.search = window.location.search;
    destination.hash = window.location.hash;
    window.location.replace(destination.href);
  </script>
  <meta http-equiv="refresh" content="0;url=./dist/">
</head>
<body>
  <p><a href="./dist/">シカクメイシのWebヒアリングを開く</a></p>
</body>
</html>
